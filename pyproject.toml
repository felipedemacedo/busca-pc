[project]
name = "busca-pc"
version = "0.1.0"
description = "Plataforma Agêntica Multiagente para Avaliação & Busca de Computadores"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
]

[project.scripts]
busca-pc = "busca_pc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busca_pc"]
